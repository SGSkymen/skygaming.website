<script>
class Header {
    constructor(){
        this.isHeaderOpened = false;
        this.isLangOpened = false;
        this.currentLang = 'ru';
        this.init();
    }
    init(){
        const burgerButton = document.getElementById('burgerButton');
        if (burgerButton){ burgerButton.addEventListener('click',()=> this.toggleHeader()); }
        const langButton = document.getElementById('langButton');
        if (langButton){ langButton.addEventListener('click',()=> this.toggleLang()); }
        const navItems = document.querySelectorAll('.nav__item');
        navItems.forEach(item =>{ item.addEventListener('click',() =>{ if (window.innerWidth < 768){ this.toggleHeader(); } }); });
        const langItems = document.querySelectorAll('.lang__item');
        langItems.forEach(item =>{ item.addEventListener('click', (e) =>{ e.stopPropagation(); const lang = item.getAttribute('data-lang'); this.changeLang(lang); }); });
    }
    toggleHeader(){ this.isHeaderOpened = !this.isHeaderOpened; const header = document.getElementById('header'); if (header){ header.classList.toggle('header_nav-opened', this.isHeaderOpened); } }
    toggleLang(){ this.isLangOpened = !this.isLangOpened; const lang = document.getElementById('langButton'); if (lang){ lang.classList.toggle('lang_opened', this.isLangOpened); } }
    changeLang(lang){ this.currentLang = lang; this.toggleLang(); document.cookie = `locale=${lang}; path=/; domain=sky-gaming.online; max-age=31536000`; }
}
document.addEventListener('DOMContentLoaded',() =>{ window.headerApp = new Header(); });
function getShopLink(){ return window.location.hostname === "sky-gaming.online" ? "https://sky-gaming.online/home.html" : "https://sky-gaming.online/"; }
</script>
